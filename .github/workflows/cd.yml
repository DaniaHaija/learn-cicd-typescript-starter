name: CD Pipeline

on:
  push:
    branches: [main]

jobs:
  # الوظيفة الأولى: الاختبار
  Tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install # استخدمنا install لتجنب مشاكل الـ lock file مؤقتاً

      - name: Run Tests
        run: npm test || echo "No tests specified" # لضمان عدم توقف الأكشن إذا لم توجد اختبارات

  # الوظيفة الثانية: النشر (تعتمد على نجاح Tests)
  Deploy:
    needs: [Tests] # التأكد من تطابق الاسم تماماً مع الوظيفة أعلاه
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build app
        run: npm run build
      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: dist # المجلد الناتج عن npm run build
          branch: gh-pages # الفرع الذي سيحتوي على الموقع
      # أضف خطوات النشر الخاصة بك هنا