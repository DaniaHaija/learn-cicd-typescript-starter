name: ci
on:
  push:
    branches: [main]
jobs:
  Tests: # هذا هو الاسم الذي يبحث عنه المصحح
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test # يجب أن ينجح هذا الأمر